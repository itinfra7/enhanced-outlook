[package]
name = "owa-cli"
description = "개발·검증용 명령줄 도구 (프로토콜 스모크 테스트)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "owa-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
futures-util.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
eo-mime.workspace = true
eo-owa.workspace = true
eo-search.workspace = true
eo-store.workspace = true
eo-sync.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# 비밀번호 입력 중 Ctrl+C로 끊긴 콘솔 입력 모드 되돌리기(prompt.rs)
windows-sys = { workspace = true, features = ["Win32_System_Console"] }


[lints]
workspace = true
